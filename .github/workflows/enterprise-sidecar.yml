name: Optional enterprise sidecar
on:
  pull_request:
  push:
    branches: [codex/enterprise-sidecar]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-enterprise.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Full suite with sidecar dependencies present
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -rs tests | tee test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-test-results
          path: test-results.log
