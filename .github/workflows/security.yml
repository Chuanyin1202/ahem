name: Security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: sh scripts/install-secure.sh
      - run: python -m pip install bandit pip-audit
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src pytest tests/test_update_project_status.py -q
      - run: bandit -q -lll -r src -x tests
      - run: pip-audit --local
      - name: Generate CycloneDX SBOM
        run: pip-audit --local --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v5
        with:
          name: ahem-sbom
          path: sbom.cdx.json
