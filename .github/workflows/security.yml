name: Security gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/check_no_secrets.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: sh scripts/install-secure.sh
      - run: python -m pip install bandit pip-audit -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run the unified security gate
        run: AHEM_PYTHON=python scripts/security-check.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ahem-sbom
          path: sbom.cdx.json
