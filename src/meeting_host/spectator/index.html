<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahem 觀戰畫面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* ── 版面與色票逐值抄自 docs/design/spectator-v2/Main.dc.html（定稿「陶土 · 極簡」）──
     這份實作的驗收標準是「與設計稿逐項數值一致」，不是「看起來像」。改任何一個
     數字前先回設計稿確認，設計稿沒有的值不要自己發明。

     設計原則：主席是版面上唯一的強調色（--accent #A65D3F），其餘一律沙系中性色；
     髮線分隔、無卡片邊框、無陰影堆疊。單一淺色主題，無深色模式。 */
  :root {
    --bg: #F4EFE7;            /* 版面底 */
    --panel: #FBF8F3;         /* 右側資料欄底 */
    --border: #E4DCCF;        /* 髮線分隔（右欄內、右欄左邊界） */
    --border-strong: #DCD3C5; /* 標題底線與次要按鈕邊框（較深的那一條） */
    --track: #EBE4D8;         /* 時間軸底軌／發言分佈底軌 */
    --text: #2B2622;          /* ink：標題、主席發言、實心按鈕底 */
    --body: #3E3833;          /* 逐字稿內文 */
    --muted: #857C72;         /* 次要文字 */
    --dim: #A89F93;           /* 更弱的文字：時間欄、正在說話、忍住的時間 */
    --bar: #B8AE9F;           /* 時間軸的發言段 */
    --share-bar: #8F8578;     /* 發言分佈的參與者填充（比 --bar 深，設計稿分開兩個值） */
    --tick: #C9C0B2;          /* 時間軸「想過但忍住」的淺色刻度 */
    --accent: #A65D3F;        /* 主席唯一強調色 */
    --accentHover: #7F4530;
    --onAccent: #F4EFE7;

    /* ── Track D 新增：主席狀態徽章三態底/字色，逐值抄自設計稿
       docs/design 提案 MainWithSidebar.dc.html 的 renderVals() table 物件
       （發言中 fg 剛好等於既有 --accent，直接重用，不重複定義）。 */
    --pill-speaking-bg: #F3E7DE;
    --pill-holding-bg: #EFEAE0;
    --pill-holding-fg: #6B6459;
    --pill-warning-bg: #FBE7DD;
    --pill-warning-fg: #C34A1E;
    /* AI 即時觀察內文與抽屜把手直立字：設計稿同一個值出現在兩處，收成一個具名變數。 */
    --body-soft: #4A453F;
    /* 抽屜把手／抽屜本體的陰影，逐值抄自設計稿；整條 box-shadow 值收進變數，
       不留裸 rgba() 字面值在規則裡。 */
    --handle-shadow: -6px 0 16px rgba(43, 38, 34, 0.06);
    --drawer-shadow: -12px 0 32px rgba(43, 38, 34, 0.08);
    /* Track E：即時會議記錄卡片底色，逐值抄自設計稿（純白，跟半透明的 --panel
       故意不同——卡片要在半透明右欄上「浮起來」）。 */
    --card-bg: #FFFFFF;
    /* Track F：Kaner 菱形「會議節奏」新增的兩個色碼，逐值抄自提案圖
       MainWithSidebar.dc.html 行 157/159-160。提案圖另外用到的 #FFFFFF／
       #A89F93／#2B2622 剛好分別等於既有 --card-bg／--dim／--text，直接重用，
       不重複定義第二份。 */
    --kaner-fill: #EAE1D2;   /* 已走過路徑的填色 */
    --kaner-track: #C9BEAD;  /* 三階段分隔虛線 */
  }

  @keyframes ahem-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    /* 【2026-09-05 Track E 更新】Zeal 明確要求比照提案圖 MainWithSidebar.dc.html
       的滿版水彩氛圍，不要只留 14px 畫框——原本 Track C 的折衷版是因為 #view/.left/
       .right 全是不透明實色，只能靠邊緣縫隙透出背景。現在改成 .left/.right 自己
       半透明（見下方 .left/.head/.right），水彩整面都看得到，畫框縫隙已無存在理由，
       改回 0，版面滿版對齊提案圖。 */
    background: transparent; color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-width: 1200px; overflow-x: auto;
    padding: 0;
  }
  a { color: var(--accent); }
  a:hover { color: var(--accentHover); }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .serif { font-family: "Noto Serif TC", "Songti TC", serif; }
  .spacer { flex-grow: 1; }

  /* 設計稿是 1440×900 的固定畫布、grid 1fr + 380px；瀏覽器版改成填滿視窗，
     右欄寬度與所有內距照抄，左欄吃剩餘寬度（＝設計稿的 1fr）。 */
  /* Track C：高度扣掉 body 的上下 14px 畫框（vh 不會自動跟著父層 padding 縮，
     width:100% 因為全域 box-sizing:border-box 會自動扣掉左右 padding，
     高度要自己算）。 */
  /* 【Track E】#view 改透明，不再是滿版不透明的 --bg——水彩氛圍改由 .left／.head／
     .right 各自的半透明底色負責（數值抄自提案圖 MainWithSidebar.dc.html 行
     19-30：header 0.68／左欄 0.42／右欄 0.88），拿掉 -28px 因為 body 已經沒有
     畫框 padding 要扣。 */
  #view { width: 100%; height: 100vh; overflow: hidden; display: flex; flex-direction: row; background: transparent; }

  /* ── 左：會議紀錄 ── */
  .left {
    display: flex; flex-direction: column; gap: 28px;
    flex-grow: 1; min-width: 0; min-height: 0;
    padding: 48px 64px 40px 72px;
    background: rgba(244, 239, 231, 0.42);
  }
  .head {
    display: flex; align-items: flex-end; gap: 24px;
    padding-bottom: 22px; border-bottom: 1px solid var(--border-strong);
    margin: -48px -64px 0 -72px; padding: 48px 64px 22px 72px;
    background: rgba(251, 248, 243, 0.68);
  }
  .head-id { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.24em; color: var(--muted); }
  .title { font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--text); letter-spacing: 0.01em; }
  .head-clock { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; position: relative; flex-shrink: 0; }
  .clock-row { display: flex; align-items: baseline; gap: 8px; }
  .clock { font-size: 36px; font-weight: 600; color: var(--text); }
  .clock-total { font-size: 13px; color: var(--muted); }
  .status { font-size: 12px; color: var(--muted); }

  /* 階段切換：設計稿沒有這個控制項（它是單一「決定階段」的靜態畫面），但現場
     demo 需要手動切階段。做法是讓設計稿本來就有的狀態列文字可點，點開一個用
     同一套色票的小選單。
     T16：實測沒人看得出這行字可以點，加一個極小的視覺暗示（游標右側一個小箭頭）
     ——不重新設計，色票／字級沿用既有 token，箭頭顏色直接繼承 .status 當下的
     顏色（含 hover 變色），不新增色碼。 */
  .status.switchable { cursor: pointer; }
  .status.switchable:hover { color: var(--text); }
  .status.switchable::after { content: " ▾"; font-size: 9px; }
  .phase-menu {
    position: absolute; top: 100%; right: 0; margin-top: 6px; z-index: 10;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden;
  }
  .phase-menu[hidden] { display: none; }
  .phase-item { padding: 7px 16px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .phase-item:hover { background: var(--track); color: var(--text); }
  .phase-item.active { color: var(--accent); }

  /* ── 主席狀態徽章（Track D，D1；提案圖 MainWithSidebar.dc.html 行 32-44/236-260）──
     三態＝發言中／忍住中／可能異常，決定邏輯見 currentChairStatus() 與
     chairBadgeAnomaly()（沿用既有 renderAlerts() 的兩個真實故障訊號）。
     顏色收在 :root 的 --pill-* 具名變數，不留裸 hex。位置放在既有 .status
     那行「之上」，不取代它——.status 仍然是可點的階段切換控制項，這裡只是
     新增一個更醒目的狀態指示，兩者資訊有重疊是刻意的（各自的用途不同：
     一個是控制項，一個是給投影看的觀察指標）。 */
  .chair-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 9px; border-radius: 999px;
  }
  .chair-badge[hidden] { display: none; }
  .chair-badge-icon { display: none; }
  .chair-badge--speaking .chair-badge-icon[data-mode="speaking"],
  .chair-badge--holding .chair-badge-icon[data-mode="holding"],
  .chair-badge--warning .chair-badge-icon[data-mode="warning"] { display: inline-flex; }
  .chair-badge--speaking { background: var(--pill-speaking-bg); color: var(--accent); }
  .chair-badge--holding { background: var(--pill-holding-bg); color: var(--pill-holding-fg); }
  .chair-badge--warning { background: var(--pill-warning-bg); color: var(--pill-warning-fg); }
  .chair-badge-label { font-size: 12px; font-weight: 600; }
  .chair-badge-caption { font-size: 11px; color: var(--muted); }
  .chair-badge-caption.warn { color: var(--pill-warning-fg); }

  /* ── 主席故障告示 ──
     設計稿沒有這個元件（它是一切正常的靜態畫面）。加它的理由是 2026-08-31 那場
     真實會議：主席 TTS 因額度耗盡連續四次講不出話，但會議進行中畫面上沒有任何
     地方顯示，現場只會覺得它「變安靜了」，分不出是判斷不介入還是壞了。
     這一條要回答的就是那個問題：**主席現在是不想講，還是講不出來／聽不到。**

     版面語言沿用既有的，不重新設計：左側 2px 強調色細線＋內縮（`.u-chair` 的
     idiom）、`--panel` 底、髮線邊框，字級 12/13px 比照 `.section-*`。色碼一個都
     沒新增——用 `--accent`（主席唯一的強調色）是刻意的：這裡講的正是主席本身
     的狀態，不是別人的事。

     放在 `.head` 與 `#transcript` 之間、`.left` 欄裡：那是不用捲就一定看得到的
     位置，而且**不會擠到右欄的兩顆按鈕**（那次事故的修法是給 `.right` 加
     `overflow-y`，這裡從一開始就不碰右欄）。`flex-shrink: 0` ＋ `#transcript`
     本來就有的 `flex-grow: 1; min-height: 0`，多出來的高度一律由逐字稿讓出。 */
  .alerts { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .alerts[hidden] { display: none; }   /* 沒有故障時完全不佔位（含 .left 的 gap） */
  .alert {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 14px 10px 12px;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-left: 2px solid var(--accent); border-radius: 4px;
  }
  .alert .a-title { font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .alert .a-detail { font-size: 12px; line-height: 1.55; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }

  /* 設計稿的逐字稿容器是 overflow:hidden（固定 900px 畫布放得下）；線上版必須
     能捲，改 overflow-y:auto，其餘（flex column、gap 22px）照抄。 */
  #transcript {
    display: flex; flex-direction: column; gap: 22px;
    flex-grow: 1; min-height: 0; overflow-x: hidden; overflow-y: auto;
  }
  .u-line { display: grid; grid-template-columns: 64px 1fr; gap: 20px; }
  /* Zeal 2026-09-05 明確要求：時間與講者名換紅色高亮＋加粗，讓掃視逐字稿時
     一眼認得出「誰、什麼時候」。用既有 --accent（主席專屬強調色），不新增
     裸 hex——主席那一行原本就靠這個顏色跟其他行區分，現在其他行的時間/
     名字也用同一色，兩者的視覺區隔改成靠下面 .u-chair 的底色遮罩，不再
     只靠顏色（見 .u-chair 註解）。 */
  .u-time { font-size: 12px; color: var(--accent); font-weight: 700; padding-top: 5px; }
  .u-text { font-size: 16px; line-height: 1.75; color: var(--body); min-width: 0; overflow-wrap: anywhere; }
  /* 設計稿的逐字稿沒有講者名（那場只有一個人）。多人會議不寫名字會讀不懂，
     所以保留講者名——這是刻意偏離。原本用 --muted／500 讓它退在內文後面，
     2026-09-05 改成跟時間戳同一組紅色高亮＋加粗（理由同上）。 */
  .u-speaker { font-weight: 700; color: var(--accent); }
  .u-line.now { align-items: center; }
  .u-line.now .u-time { padding-top: 0; }
  .u-line.now .u-text { font-size: 13px; color: var(--dim); }
  /* 主席行的時間色已經跟其他行一致（見上面 .u-time），這裡不用再重複覆寫。 */
  /* Zeal 2026-09-05：主席發言原本只靠左邊 2px 細線區分，他覺得不夠明顯——
     加一層淺灰底色遮罩當作真正的「這是主席在說話」的視覺容器，而不是只靠
     一條細線。用既有 --track（設計稿裡本來就是「淺灰」語意的那個變數，時間軸
     底軌用的就是它），不新增裸 hex。加了背景就要補右/上/下 padding 跟圓角，
     不然背景色只會貼著文字邊緣，不像一個容器。 */
  .u-chair {
    display: flex; flex-direction: column; gap: 8px; min-width: 0;
    padding: 12px 16px 12px 18px; border-left: 2px solid var(--accent);
    background: var(--track); border-radius: 0 6px 6px 0;
  }
  .u-chair .who { font-size: 11px; letter-spacing: 0.18em; color: var(--accent); }
  .u-chair .say { font-size: 17px; line-height: 1.7; color: var(--text); overflow-wrap: anywhere; }

  /* ── 右：資料欄 ── */
  .right {
    display: flex; flex-direction: column; gap: 26px;
    width: 380px; flex-shrink: 0; min-height: 0;
    padding: 48px 40px 40px 36px;
    /* Track E：改半透明（抄提案圖右欄 0.88），讓水彩從右欄也透出來——0.88 已經
       夠不透明，文字對比不受影響。 */
    background: rgba(251, 248, 243, 0.88); border-left: 1px solid var(--border);
    /* 設計稿是 1440×900 的固定畫布，右欄內容剛好填滿、不需要捲。加了「提示卡」
       之後在 900px 高的視窗會超出——原本超出的部分是直接被切掉的（實測：兩顆
       按鈕整個按不到），那不是刻意的設計，只是從來沒超出過。這裡讓它在超出時
       可以捲；內容放得下時捲軸不出現，版面與設計稿完全一致。 */
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: var(--dim) var(--track);
  }
  .right::-webkit-scrollbar { width: 6px; }
  .right::-webkit-scrollbar-track { background: var(--track); }
  .right::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
  .right::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .rule { height: 1px; background: var(--border); flex-shrink: 0; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 18px; flex-shrink: 0; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  /* Track C：KPI 數字改用 --muted，跟 #minutes-live／「主席的思考」維持的
     --text 拉開一層輕重（既有設計本來就用 --muted 標示次要文字，如
     stat-label／section-hint／u-time，這裡沒有新增色碼）。 */
  .stat-value { font-size: 28px; font-weight: 600; color: var(--muted); }
  .stat-unit { font-size: 14px; font-weight: 400; color: var(--muted); }
  .stat-sub { font-size: 12px; color: var(--muted); }

  .section { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
  .section-head { display: flex; align-items: baseline; gap: 10px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .section-hint { font-size: 11px; color: var(--muted); }

  /* Track C 的 `.drawer`／`.drawer > summary`／`.drawer-body`／`.section-secondary`
     四組規則在這裡被移除：它們唯一的使用者是 `<details class="drawer"
     id="group-dynamics">` 那個 inline 收合面板，已被 Track D 的滑入式覆疊抽屜
     （`.dyn-handle`／`.dyn-drawer`，見下方）整個取代，留著就是沒有任何元素會
     命中的孤兒規則。抽屜殼本身的樣式改看 `.dyn-*`。 */

  /* 會議產出（預覽）：設計稿之外新增，沿用「主席的思考」同一種版面語言
     （左細線＋兩行內容），只用既有色票，不發明新樣式。 */
  /* Track E：即時會議記錄改白卡片，逐值抄自提案圖 MainWithSidebar.dc.html
     行 82-105——決議/未解決事項用卡片（未解決是虛線邊框，跟已拍板的決議做視覺
     區分），待辦事項維持提案圖原本的純文字列（提案圖本來就沒把待辦裝進卡片）。 */
  .minutes-live { display: flex; flex-direction: column; gap: 16px; }
  .ml-group { display: flex; flex-direction: column; gap: 10px; }
  .ml-group-head { display: flex; align-items: baseline; gap: 8px; }
  .ml-group-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .ml-count { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 600; color: var(--muted); }
  .ml-list { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
  .ml-list li {
    font-size: 14px; line-height: 1.55; color: var(--text);
  }
  .ml-list.ml-list--card li {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    padding: 10px 12px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px;
  }
  .ml-list.ml-list--card.ml-list--unresolved li { border-style: dashed; border-color: var(--border-strong); }
  .ml-list.ml-list--plain li {
    display: grid; grid-template-columns: 60px 1fr; gap: 10px; font-size: 13px;
  }
  .ml-badge-new {
    position: absolute; top: -6px; right: -6px; padding: 1px 7px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border-strong); color: var(--muted);
    font-size: 9px; font-weight: 700;
  }
  .ml-who { font-size: 11px; font-weight: 500; color: var(--muted); }
  .ml-what { font-size: 14px; font-weight: 500; line-height: 1.55; color: var(--text); }
  .ml-muted { color: var(--muted); }
  .ml-empty { font-size: 12px; color: var(--muted); }

  .judge-list { display: flex; flex-direction: column; gap: 10px; }
  .judge { display: grid; grid-template-columns: 40px 1fr; gap: 10px; font-size: 12px; line-height: 1.55; }
  .judge .jt { color: var(--accent); }
  /* 設計稿的理由是一句短話（「要求直接列出方案要點」）；慢路實際回傳的 pros 是
     完整句子，不夾在兩行內會把整個面板撐開。截兩行，不改寫內容。 */
  .judge .jx {
    color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .judge.withheld .jt { color: var(--dim); }
  .judge.withheld .jx { color: var(--muted); }
  /* 第三態（受阻／評估中）：時間戳調到 --muted，比忍住的 --dim 淺、比開口的
     --accent 深——三格一眼就能分出「沒發生」「不確定／被擋下」「發生了」的層次。
     內文不調暗，維持跟開口一樣的可讀度：受阻是這張單最想被看見的狀態。 */
  .judge.blocked .jt { color: var(--muted); }

  /* 提示卡：術語／專有名詞的靜默補充。沿用「主席的思考」那一區的版面語言
     （左細線＋兩行截斷），不新增色碼。刻意**不用** --accent——那是主席開口的
     唯一強調色，提示卡不是主席發言，借用會讓兩件事在畫面上混成一件。
     來源連結因此用內文色＋髮線底線表示可點。 */
  .gcard { display: flex; flex-direction: column; gap: 5px; font-size: 12px; line-height: 1.55; padding-left: 12px; border-left: 2px solid var(--track); }
  /* 逐字稿流裡的提示卡：借用 .u-line 的 64px 時間槽對齊，卡片本體沿用 .gcard
     的語言（左細線、無邊框、不用 --accent——那是主席開口的唯一強調色，提示卡
     不是主席發言）。字級 13px：比逐字稿的 16px 小一階，讀得清楚但不搶戲。
     max-width 讓它不隨左欄寬度無限拉長，維持「旁註」而不是「另一段發言」。 */
  .u-line.gloss .gcard { font-size: 13px; max-width: 560px; }
  .u-line.gloss .gc-term { font-size: 14px; }
  .u-line.gloss .gc-tag { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  .u-cursor { color: var(--dim); animation: blink 1s steps(2) infinite; }
  .u-line.now.placeholder .u-live { color: var(--dim); }
  .u-line.now.placeholder .u-cursor { display: none; }
  .u-line.now { transition: opacity .6s ease; }
  .u-line.now.stale { opacity: .35; }
  .u-line.settle .u-text { animation: settle .35s ease-out; }
  .u-line.rewrite-settle .u-text { animation: crossfade .25s ease-out; }
  @keyframes crossfade { from { opacity: .15; } to { opacity: 1; } }
  .u-live.rewrite { animation: flick .15s ease; }
  @keyframes flick { from { opacity: .25; } to { opacity: 1; } }
  @keyframes settle { from { color: var(--dim); } to { color: inherit; } }
  @keyframes blink { to { visibility: hidden; } }
  .gc-head { display: flex; align-items: baseline; gap: 8px; }
  .gc-term { font-size: 13px; font-weight: 700; color: var(--text); overflow-wrap: anywhere; }
  .gc-count { font-size: 11px; color: var(--muted); flex-shrink: 0; margin-left: auto; }
  .gc-gloss { color: var(--body); }
  .gc-src { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .gc-src a { font-size: 11px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--border-strong); overflow-wrap: anywhere; }
  .gc-src a:hover { color: var(--text); text-decoration-color: var(--muted); }
  .gc-quote { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gc-quote .qt { color: var(--dim); }
  .gc-empty { font-size: 12px; color: var(--muted); }

  .share-list { display: flex; flex-direction: column; gap: 10px; }
  /* 名字欄設計稿是 44px（那場的名字是「Alex」）。真實 display_name 是「Alex Huang」，
     44px 只放得下「Alex …」，所以加寬到 72px、軌道相應縮短——這是與設計稿唯一
     一處刻意不同的幾何值。更長的名字仍然截字，完整名字放 title。 */
  .share { display: grid; grid-template-columns: 72px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
  .share .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .share .track { height: 8px; background: var(--track); border-radius: 2px; }
  .share .fill { height: 8px; background: var(--share-bar); border-radius: 2px; }
  .share .fill.chair { background: var(--accent); }
  .share .pct { text-align: right; color: var(--muted); }

  /* ── AI 即時觀察（Track D，D2；提案圖行 108-122）──
     內容全部是規則從既有已算好的數字/事件換算出來的一句話，不呼叫 LLM，
     見 index.html 開頭的說明與 renderObservations() 系列函式。 */
  .obs-panel { flex-grow: 1; min-height: 140px; }
  .obs-head { align-items: center; }
  .obs-live { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .obs-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); animation: ahem-pulse 1.6s ease-in-out infinite; }
  .obs-list {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; line-height: 1.6; flex-grow: 1; min-height: 60px;
    /* Zeal 2026-09-05 截圖指出：這個框本來就該是「框架固定、內容自己捲」——
       原本沒設 max-height，flex-grow 在 auto-height 的父層裡不會真的產生
       可捲動空間（scrollHeight==clientHeight，實測過），於是整個 .right
       欄位跟著長高變成外層在捲，「結束會議」按鈕會被推出視窗（.right 本來
       就有這個已知風險，見上面 .right 的說明）。加 max-height 讓這裡自己
       變成會捲動的那個框，配合下面既有的 `box.scrollTop = box.scrollHeight`
       自動貼齊最新一筆——舊的觀察會捲上去、捲出視窗消失，框本身大小不動。
       用 vh 當上限是為了 RWD：矮視窗（筆電）自動縮小，不會反過來把版面撐爆。 */
    max-height: min(320px, 34vh); overflow-y: auto;
  }
  .obs-empty { color: var(--muted); }
  .obs-row .ot { color: var(--dim); }
  .obs-row .ok { font-weight: 700; color: var(--text); }
  /* T-G：心聲類（class 名稱維持 ok-critique 內部識別不改，顯示文字是「心聲」）
     是真的呼叫 LLM，跟其餘三類規則算出來的不同——用主席的強調色區分，見
     renderObservations()。 */
  .obs-row .ok.ok-critique { color: var(--accent); }
  .obs-row .ox { color: var(--body-soft); overflow-wrap: anywhere; }
  .obs-cursor { color: var(--body-soft); animation: ahem-pulse 1s step-end infinite; }
  .obs-note { font-size: 10px; color: var(--muted); }

  /* ── 群體動力：滑入式覆疊抽屜（Track D，D3；提案圖行 19-21/126-233）──
     內容＝既有的 KPI／時間軸／主席的思考／發言分佈四塊，資料與渲染邏輯完全
     不變，只是從常駐版面搬進這個抽屜殼（見下方 #dyn-drawer 內的原始標記）。
     生產版的 .head 只蓋在左欄之上（跟提案圖的通版標題列不同），所以抽屜從
     視窗最頂端開始也不會蓋到主席徽章——不需要照抄提案圖的 `top:160px` 硬座標。 */
  .dyn-handle {
    position: fixed; top: calc(50% + 80px); right: 0; transform: translateY(-50%);
    z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 9px; background: var(--panel); border: 1px solid var(--border-strong); border-right: none;
    border-radius: 10px 0 0 10px; cursor: pointer; box-shadow: var(--handle-shadow);
    font: inherit; color: inherit; appearance: none;
  }
  .dyn-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dyn-handle-icon { color: var(--muted); }
  .dyn-handle-label { writing-mode: vertical-rl; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; color: var(--body-soft); }
  .dyn-chevron { color: var(--dim); transition: transform 0.2s; }
  .dyn-handle[aria-expanded="true"] .dyn-chevron { transform: rotate(180deg); }

  .dyn-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; z-index: 6;
    box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;
    padding: 30px 32px 26px 32px; background: var(--panel); border-left: 1px solid var(--border-strong);
    box-shadow: var(--drawer-shadow); transform: translateX(100%); transition: transform 0.28s ease;
    overflow-y: auto;
  }
  .dyn-drawer.open { transform: translateX(0); }
  .dyn-drawer-head { display: flex; align-items: flex-start; gap: 12px; }
  .dyn-drawer-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--text); }
  .dyn-drawer-sub { font-size: 10px; color: var(--dim); }
  .dyn-close {
    display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    margin: -6px -8px 0 0; border-radius: 8px; color: var(--muted); cursor: pointer;
    background: none; border: 0; font: inherit;
  }
  .dyn-close:hover { background: var(--track); }
  .dyn-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── 會議節奏：Kaner 菱形（Track F；提案圖行 149-171）──
     菱形本身的座標／填色路徑／分隔線全部由 renderKanerDiamond() 用真實資料
     算出、寫進 #kaner-diamond 的 innerHTML（見下方 <script>），這裡只放跟
     SVG 無關的外圍樣式：標題列的現況字＋下面三欄文字標籤＋說明文字。 */
  .kaner-now { font-size: 12px; font-weight: 700; color: var(--text); }
  .kaner-labels { display: grid; }
  .kaner-label { text-align: center; font-size: 10px; color: var(--dim); }
  .kaner-label.active { font-size: 13px; font-weight: 700; color: var(--text); }
  .kaner-caption { font-size: 12px; line-height: 1.6; color: var(--body); }
  .kaner-caption-time { color: var(--dim); }

  .actions { display: flex; gap: 10px; flex-shrink: 0; }
  .btn { flex-grow: 1; padding: 11px 0; text-align: center; font-size: 13px; border-radius: 6px; cursor: pointer; user-select: none; }
  .btn-ghost { border: 1px solid var(--border-strong); color: var(--text); }
  .btn-solid { background: var(--text); color: var(--onAccent); border: 0; }

  /* 捲軸配色沿用既有 token，不新增色碼 */
  #transcript { scrollbar-width: thin; scrollbar-color: var(--dim) var(--track); }
  #transcript::-webkit-scrollbar { width: 8px; }
  #transcript::-webkit-scrollbar-track { background: var(--track); border-radius: 4px; }
  #transcript::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
  #transcript::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>

  </div>

  <div class="rule"></div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">時間軸</div>
      <div class="section-hint">發言 · 主席開口 · 忍住 · 階段</div>
    </div>
    <svg id="timeline" width="304" height="86" viewBox="0 0 304 86" style="display: block;"></svg>
  </div>

  <div class="rule"></div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">主席的思考</div>
      <div class="section-hint">每 5 秒想一次要不要開口 · 最近三次</div>
    </div>
    <div class="judge-list" id="judge-list"></div>
  </div>

  <div class="rule"></div>

  <div class="section">
    <div class="section-title">發言分佈</div>
    <div class="share-list" id="share-list"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // 顯示層命名對照（內部值不動，見 docs/design/spectator-v2/canvas.json 的便籤）
  var PHASE_LABEL = { "發散期": "發想", "呻吟區": "拉鋸", "收斂期": "決定" };
  // 慢路沒開口的原因 → 畫面措辭。空字串＝LLM 自己判不需要介入（不是被規則壓掉）。
  var WITHHELD_REASON = {
    "": "判斷不需要開口",
    "type=無": "想說但沒理由",
    "冷卻": "剛開口過，30 秒內不再插話",
    "無話術": "有判斷但沒話術",
    "收尾": "會議正在道別，不再開口",
    "失聰": "主席聽不到，暫不開口",
  };
  // 慢路是兩次 LLM 呼叫：先判斷、決定要講之後才產話術（見 live.py _run_slow_score）。
  // 下面這些 reason 全部發生在「已經決定要開口」之後，是話術生成或那幾秒內變動的
  // 世界把它擋掉的——不是主席選擇忍住。所以它們算「受阻」而不是「忍住」，
  // 顯示成忍住會把失敗說成克制，那是假的（須與 live.SLOW_BLOCKED_AFTER_DECISION 一致）。
  // 守恆不變式不受影響：每筆 slow_score 仍然只計一次，只是落到另一格。
  var BLOCKED_AFTER_DECISION_REASON = {
    "話術失敗": "決定開口但話術生成失敗",
    "話術過長": "話術太長，播出來會變獨白",
    "冷卻(話術後)": "想好話時已在冷卻期內",
    "收尾(話術後)": "想好話時會議已在道別",
    "失聰(話術後)": "想好話時主席已經聽不到",
  };
  // 連續幾次 TTS 失敗才在畫面上喊「主席講不出話」。
  // 2 而不是 1：一次逾時跟額度耗盡是兩件不一樣的事——單次失敗每場都可能發生
  // （網路抖一下、播放佇列滿），喊出來就是誤報。連續兩次以上代表**同一段時間內
  // 主席想開口而開不了口**，那才是現場需要立刻知道的事。
  // 「連續」的歸零條件只有一個：真的 spoken 一次（見 handleEvent 的 "spoken"）。
  // `dropped` 不歸零也不累加——那是介入被作廢，跟發聲能力無關。
  var TTS_FAIL_ALERT = 2;
  var SILENCE_LIMIT = 300;  // 快路「有人被冷落」的門檻，用來判斷最長沉默有沒有觸發超時
  // 快路規則型 kind，須與 fast_path.FAST_KINDS 一致（見該檔案）。「主席開口」那格
  // 拆成「規則 N（這裡列的快路 kind）· 判斷 M（其餘 kind，來自慢路 LLM 評分）」——
  // 前端沒有共用模組可以 import，兩邊改動要一起改。
  var FAST_KINDS = ["發言超時", "有人被冷落", "議程超時", "全場沉默"];

  function el(id) { return document.getElementById(id); }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtClock(seconds) {
    if (seconds == null || !isFinite(seconds)) return "--:--";
    var s = Math.max(0, Math.floor(seconds));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" + m : "" + m) + ":" + (r < 10 ? "0" + r : "" + r);
  }

  // 設計稿的最長沉默寫成 3′35″（分秒用 prime／double prime，不是冒號）
  function fmtSpan(seconds) {
    var s = Math.max(0, Math.floor(seconds || 0));
    var m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + "″";
    return m + "′" + (r < 10 ? "0" + r : "" + r) + "″";
  }

  function nodeFromHtml(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = html.trim();
    return tmp.firstElementChild;
  }

  // 真實時鐘時間，固定 UTC+8——不用瀏覽器本地時區，因為觀戰畫面可能開在別台機器上。
  // epochSeconds 是 unix epoch（UTC）秒；用「加 8 小時再讀 UTC 欄位」手動套固定偏移，
  // 不靠 Date 物件的本地時區轉換。印成 HH:MM（不含秒），跟 fmtClock 一樣是 5 個字元，
  // 逐字稿的時間欄只有 64px、主席的思考欄更窄（40px），沒有多的空間放秒數。
  function fmtWallClock(epochSeconds) {
    var d = new Date((epochSeconds + 8 * 3600) * 1000);
    var hh = d.getUTCHours(), mm = d.getUTCMinutes();
    return (hh < 10 ? "0" + hh : "" + hh) + ":" + (mm < 10 ? "0" + mm : "" + mm);
  }

  // 逐字稿／主席的思考每一列的時間：有 meeting 事件帶回 start_epoch 就顯示真實時鐘
  // 時間，否則（還沒收到 meeting 事件，或回放模式讀到 T16 之前錄的舊 events.jsonl
  // 沒有這個欄位）退回顯示會議相對時間，不顯示錯誤值或空白。
  function fmtEventTime(t) {
    var epoch = state.meeting && isFinite(state.meeting.start_epoch) ? state.meeting.start_epoch : null;
    return epoch == null ? fmtClock(t) : fmtWallClock(epoch + t);
  }

  // 「實際發言」用區間聯集算，不是各人加總——多人會議講話會重疊，加總會把重疊的
  // 那幾秒算進兩個人頭上，佔已進行的百分比因此可能衝出 100%（單人會議不會重疊，
  // 聯集跟加總結果相同，既有行為不變）。segments 依事件到達順序塞入，不保證按
  // start 排序，這裡自己排序後合併。
  function unionSeconds(segments) {
    if (!segments.length) return 0;
    var sorted = segments.slice().sort(function (a, b) { return a.start - b.start; });
    var total = 0, curStart = sorted[0].start, curEnd = sorted[0].end;
    for (var i = 1; i < sorted.length; i++) {
      var seg = sorted[i];
      if (seg.start <= curEnd) {
        if (seg.end > curEnd) curEnd = seg.end;
      } else {
        total += curEnd - curStart;
        curStart = seg.start;
        curEnd = seg.end;
      }
    }
    total += curEnd - curStart;
    return total;
  }

  // ── 狀態 ──
  // 右欄四格數字、時間軸、主席的思考都是「跟著事件累積」出來的衍生值，全部集中在
  // 這裡，snapshot 重播時由 resetForSnapshot() 一次清乾淨（見該函式說明）。
  var state = {
    meeting: null,
    transcript: [],
    transcriptDirty: false,
    speaking: {},
    pendingQueued: [],
    lastSpokenAt: null,
    share: {},
    serverNow: 0,
    connectionLost: false,
    needToken: false,
    ended: false,
    minutes: null,          // minutes 事件的 payload（兩份 md 全文＋四路徑，final=true 那份）
    minutesLive: null,      // 進行中預覽（final=false）最近一次的 decisions/todos/unresolved；
                             // 只被預覽事件更新，final=true 到達時刻意不覆蓋——鎖畫面當下
                             // 那一刻的預覽內容留在畫面上，不會突然清空（見 renderMinutesLive）

    spokenKinds: {},        // 介入類型 -> 次數（含問候；「主席開口」那格顯示時排除問候）
    segments: [],           // 每個人的發言區間 {start, end}；「實際發言」用區間聯集算，
                             // 不能直接加總——多人會議講話會重疊（同一秒兩人都在講，
                             // 加總會把那一秒算兩次，佔比因此衝出 100%，見 renderStats）
    chairMarks: [],         // 時間軸的主席開口 t
    withheldMarks: [],      // 時間軸的忍住 t
    phaseMarks: [],         // 時間軸的階段切換 {t, phase}
    phaseHint: null,        // 偵測器最近一次建議（與現況不同才顯示）
    partials: {},           // 各人這段目前講到哪（partial 累積全文），utterance 定稿後清掉
    liveAt: {},             // 各人活的那行最後一次更新的會議時間（過期用）
    maxSilence: 0,          // 全場最長沉默（各參與者沉默秒數取最小值的歷史最大）
    // 慢路判斷是三態，不是兩態：admissible 只代表「排進佇列」，真正有沒有開口
    // 要等後續事件才定案——可能真的 spoken；也可能連佇列都沒排進去（Chair.request()
    // 忙碌／退避中回 False，下一筆事件不是它的 queued，見 handleEvent 開頭那段）；
    // 或排進去了才被 dropped（revision 過期作廢）／failed（播放失敗）。三者都算
    // 「受阻」，在對應那個「定案的事件」到達時才計數，不是在 slow_score 當下。
    // 第四種「受阻」是 admissible=false 但 reason 落在 BLOCKED_AFTER_DECISION_REASON
    // 裡的那幾筆——慢路的第二次呼叫（話術）失敗或那幾秒內世界變了。它在 slow_score
    // 當下就定案（沒有後續事件會來），所以直接計數，不進 awaitingQueuedJudgment。
    // slowWithheld 例外：admissible=false 當下就確定是「忍住」，不用等。
    // 只要每筆 admissible 判斷後面確實有再收到事件（正常結束會有 minutes 收尾），
    // slowSpoke+slowBlocked+slowWithheld 就會等於 slowTotal；唯一會讓加總小於
    // slowTotal 的情況是連線在某筆 admissible 判斷之後真的斷了、沒有任何後續事件
    // 可以判斷結果——那是誠實的「不知道」，見 handleEvent 開頭那段的說明。
    slowTotal: 0, slowSpoke: 0, slowBlocked: 0, slowWithheld: 0,
    judgments: [],          // 主席的思考最近三次（新→舊）
    // 提示卡（新→舊）。這是唯一一種不代表主席行為的事件——不經過 Chair、不佔
    // 冷卻期、不發 TTS，所以它不進逐字稿欄、不上時間軸、也不計入任何一格數字，
    // 只在自己的區塊裡列出來（見 glossary.py 與 events.py 的 kind 說明）。
    // 排進佇列後還在等 spoken／dropped／failed 定案的慢路 judgment 物件；一次只會
    // 有一筆，靠「緊接在 admissible 慢路後面的下一筆事件一定是它的 queued」配對
    // （見 live.py _run_slow_score 與 minutes.py _pair_interventions 的說明），
    // 所以每次 handleEvent 呼叫都無條件清空，只有那唯一一次 queued 用得到。
    awaitingQueuedJudgment: null,

    // ── 主席故障告示（見 renderAlerts）────────────────────────────────
    // 最後一筆 hearing 事件的 data。它是**邊緣事件**（只在狀態改變時送，見
    // events.py 的 kind 說明），所以這裡存的是「目前的狀態」，不是「剛剛發生的事」。
    hearing: null,
    ttsFailStreak: 0,       // 距上一次成功 spoken 以來，連續幾次 TTS 失敗
    lastTtsFail: null,      // 最後一次失敗的 {t, reason, kind}，給告示顯示細節

    // ── AI 即時觀察（見 renderObservations）────────────────────────────
    // 三類（觀察/判斷/留意）各自的「上一次推播文字」，內容沒變就不重推。
    obsLastText: { observe: null, judge: null, notice: null },
    observations: [],       // {t, kind, text}，新→舊
    phaseTransitions: [],   // {t, from, to}：真的發生過的階段切換，判斷類規則要用
                             // 「拉鋸→決定」這種轉換方向，既有的 phaseMarks 只記
                             // 切到哪一階段、不記從哪裡切過來，所以另開一份。
  };

  // ── 頂列 ──
  function currentChairStatus() {
    if (state.pendingQueued.length > 0) return "等停頓";
    if (state.lastSpokenAt != null && state.serverNow - state.lastSpokenAt < 6) return "發言中";
    return "聆聽中";
  }

  // ── 主席狀態徽章（Track D，D1）────────────────────────────────────────
  // 三態：發言中／忍住中／可能異常。「可能異常」沿用 renderAlerts() 的兩個
  // 真實故障訊號（主席聽不到／連續講不出話），不是提案圖那種憑空的秒數門檻。
  // 額外加了 maxSilence 觸發既有 SILENCE_LIMIT 超時門檻當第三個觸發條件——
  // 這不是新發明的判斷，SILENCE_LIMIT 本來就是「有人被冷落」快路的既有門檻，
  // 畫面上 s-silence-sub 已經用它顯示「曾觸發超時」，這裡只是把同一個既有事實
  // 也反映到頂部徽章（工作單 D1 明講這條可加、但要寫清楚理由，理由如上）。
  function chairBadgeAnomaly() {
    if (state.hearing && state.hearing.ok === false) return "hearing";
    if (state.ttsFailStreak >= TTS_FAIL_ALERT) return "tts";
    if (state.maxSilence >= SILENCE_LIMIT) return "silence";
    return null;
  }

  // 「等停頓」（已排進佇列、正等一個空檔開口）算「忍住」而不是「發言中」：
  // 這一刻主席還沒真的發出聲音，跟聆聽中一樣是安靜的，只是安靜的原因不同
  // （見工作單 D1：只能三態，不能為它另開第四種）。
  function renderChairBadge() {
    var badge = el("chair-badge");
    var captionEl = el("chair-badge-caption");
    if (!state.meeting || state.ended) { badge.hidden = true; captionEl.textContent = ""; return; }
    badge.hidden = false;
    var anomaly = chairBadgeAnomaly();
    var since = state.lastSpokenAt == null ? state.serverNow : Math.max(0, state.serverNow - state.lastSpokenAt);
    var mode, caption;
    if (anomaly) {
      mode = "warning";
      if (anomaly === "hearing") {
        caption = "主席聽不到逐字稿" + (state.hearing.reason ? "（" + state.hearing.reason + "）" : "");
      } else if (anomaly === "tts") {
        caption = "連續 " + state.ttsFailStreak + " 次開口失敗";
      } else {
        caption = "已 " + fmtSpan(state.maxSilence) + " 沒有人開口，超過既有超時門檻";
      }
    } else if (currentChairStatus() === "發言中") {
      mode = "speaking";
      caption = "本次發言已 " + Math.round(since) + " 秒";
    } else {
      mode = "holding";
      caption = "已忍住 " + Math.round(since) + " 秒 · 忍住是設計，不是故障";
    }
    badge.className = "chair-badge chair-badge--" + mode;
    el("chair-badge-label").textContent = mode === "speaking" ? "發言中" : mode === "holding" ? "忍住中" : "可能異常";
    captionEl.textContent = caption;
    captionEl.classList.toggle("warn", mode === "warning");
  }

  // 主席故障告示：回答現場最急的那個問題——**主席現在是「不想講」還是壞了**。
  // 兩種故障各自獨立，可以同時出現（2026-08-31 那場就是：STT 與 TTS 共用同一把
  // key，額度耗盡時兩邊一起死）。
  //
  // 兩者的資料來源不一樣，是刻意的：
  // - 聽不到：後端的 `hearing` 事件（判定邏輯在 hearing.py，前端不重算）。
  // - 講不出話：從既有的 `failed`／`spoken` 事件自己數，後端不必多發一種事件。
  //   這樣舊的 events.jsonl 回放也照樣顯示得出來。
  function renderAlerts() {
    var rows = [];
    if (state.hearing && state.hearing.ok === false) {
      rows.push({
        title: "主席聽不到",
        detail: (state.hearing.reason || "逐字稿停止更新")
          + " · 已暫停「發言超時／有人被冷落／全場沉默」，"
          + "逐字稿一恢復就自動解除（議程提醒不受影響）",
      });
    }
    if (state.ttsFailStreak >= TTS_FAIL_ALERT) {
      var f = state.lastTtsFail || {};
      rows.push({
        title: "主席講不出話",
        detail: "連續 " + state.ttsFailStreak + " 次開口失敗，一次都沒出聲"
          + (f.reason ? "。最後一次：" + String(f.reason).slice(0, 120) : ""),
      });
    }
    var box = el("alerts");
    box.hidden = rows.length === 0;
    box.innerHTML = rows.map(function (r) {
      return '<div class="alert"><div class="a-title">' + esc(r.title) + '</div>'
        + '<div class="a-detail">' + esc(r.detail) + '</div></div>';
    }).join("");
    renderChairBadge();   // 兩個真實故障訊號的來源就是上面算的 rows，同步更新頂部徽章
  }

  function renderTop() {
    var m = state.meeting;
    el("topic").textContent = m ? m.topic : "等待會議開始…";
    el("clock").textContent = fmtClock(state.serverNow);
    el("clock-total").textContent = m ? "/ " + fmtClock(m.duration_min * 60) : "/ --:--";
    el("minutes-live-clock").textContent = fmtClock(state.serverNow);

    var statusEl = el("status");
    statusEl.classList.toggle("switchable", !!m && !state.ended);
    if (state.ended) {
      statusEl.textContent = "會議已結束";
    } else if (state.needToken) {
      statusEl.textContent = "需要權杖才能觀看";
    } else if (state.connectionLost) {
      statusEl.textContent = "連線中斷";
    } else if (!m) {
      statusEl.textContent = "等待會議開始";
    } else {
      var phase = PHASE_LABEL[m.phase] || m.phase;
      var hint = state.phaseHint && state.phaseHint.phase !== m.phase
        ? "　（建議：" + (PHASE_LABEL[state.phaseHint.phase] || state.phaseHint.phase) + "）" : "";
      // 主席狀態改由上面新增的頂部徽章（chair-badge）顯示，這裡不再重複
      // 「· 主席聆聽中」——避免同一件事在畫面上出現兩份、其中一份用字還不同。
      statusEl.textContent = phase + "階段" + hint;
    }

    document.querySelectorAll("#phase-menu .phase-item").forEach(function (item) {
      item.classList.toggle("active", !!m && item.dataset.phase === m.phase);
    });
    renderChairBadge();
  }

  // ── 操作權杖 ──
  // 伺服器啟動時印出的 ?k=… 才能 POST /phase 與 /end；沒有權杖的人是唯讀觀眾。
  // 讀完立刻用 replaceState 把 k 從網址列抹掉：demo 時這個畫面會投影出去，
  // token 留在網址列等於公開。之後靠 sessionStorage 撐過重新整理。
  var authToken = (function () {
    var q = new URLSearchParams(location.search).get("k");
    if (q) {
      try { sessionStorage.setItem("ahem-token", q); } catch (e) { /* 隱私模式 */ }
      var clean = location.pathname + location.hash;
      history.replaceState(null, "", clean);
      return q;
    }
    try { return sessionStorage.getItem("ahem-token") || ""; } catch (e) { return ""; }
  })();
  function canOperate() { return !!authToken; }
  function authHeaders(extra) {
    var h = extra || {};
    if (authToken) h["X-Ahem-Token"] = authToken;
    return h;
  }
  // 唯讀觀眾不顯示會誤導的操作項——按了只會拿到 403。
  if (!canOperate()) {
    el("btn-end").hidden = true;
    el("status").style.cursor = "default";
  }

  // 階段切換：點狀態列開選單。POST /phase 後伺服器會重送 meeting 事件，
  // 這裡不做本地樂觀高亮，等事件回來再 renderTop()（單一事實來源）。
  el("status").addEventListener("click", function (e) {
    if (!state.meeting || state.ended || !canOperate()) return;
    e.stopPropagation();
    el("phase-menu").hidden = !el("phase-menu").hidden;
  });
  document.addEventListener("click", function () { el("phase-menu").hidden = true; });
  document.querySelectorAll("#phase-menu .phase-item").forEach(function (item) {
    item.addEventListener("click", function (e) {
      e.stopPropagation();
      el("phase-menu").hidden = true;
      fetch("/phase", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ phase: item.dataset.phase }),
      }).catch(function (err) { console.error("切換階段失敗", err); });
    });
  });

  function setConnectionLost(lost) {
    if (state.ended) return;
    state.connectionLost = lost;
    renderTop();
  }

  function setEnded() {
    state.ended = true;
    state.connectionLost = false;
    el("phase-menu").hidden = true;
    // 結束鈕要跟著進終態：不管當下卡在「再按一次結束」的確認倒數，還是
    // fetch 還沒回來的「結束中…」，會議真的結束了就蓋成「已結束」，並清掉
    // 還沒到期的確認倒數計時器，避免它事後把文字改回「結束會議」。
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
    endArmed = false;
    endBtn.textContent = "已結束";
    renderTop();
  }

  window.__spectator = window.__spectator || {};
  window.__spectator.setEnded = setEnded;
  // 測試用：讓瀏覽器測試能讀狀態、灌單筆事件（見 tests/test_spectator_phase.py）
  window.__spectator.state = state;
  window.__spectator.handleEvent = handleEvent;
  Object.defineProperty(window.__spectator, "typers", { get: function () { return typers; } });   // var 提升：取用時才讀

  // ── 逐字稿（append-only；使用者位於底部時才自動捲到最新） ──
  var renderedCount = 0;
  var nodes = [];

  function isNearBottom(e, threshold) {
    return e.scrollTop + e.clientHeight >= e.scrollHeight - (threshold || 24);
  }

  function buildLine(item) {
    // 提示卡：靜默補充，不是主席行為。接在逐字稿當下位置而不是術語出現的位置——
    // 抽取是批次的（glossary.BATCH_MIN_UTTERANCES 12 則／BATCH_MAX_WAIT_SECONDS
    // 120s），卡片比術語晚一分鐘以上才產生，錨回原位等於插進已經捲過去的地方，
    // 投影時沒有人看得到。卡片自己的引言帶著首次提到的時間戳，指得回那一刻。
    if (item.kind === "gloss") {
      return nodeFromHtml(
        '<div class="u-line gloss">' +
        '<div class="u-time mono"></div>' +
        '<div>' + glossCard(item.card, true) + "</div></div>");
    }
    if (item.kind === "chair") {
      var label = item.speaker + (item.type ? " · " + item.type : "");
      return nodeFromHtml(
        '<div class="u-line chair">' +
        '<div class="u-time mono">' + esc(fmtEventTime(item.t)) + '</div>' +
        '<div class="u-chair">' +
        '<div class="who">' + esc(label) + '</div>' +
        '<div class="say serif">' + esc(item.text) + '</div>' +
        '</div></div>');
    }
    return nodeFromHtml(
      '<div class="u-line">' +
      '<div class="u-time mono">' + esc(fmtEventTime(item.t)) + '</div>' +
      '<div class="u-text"><span class="u-speaker">' + esc(item.speaker) + '</span>　' + esc(item.text) + '</div>' +
      '</div>');
  }

  var liveNodes = {};   // speaker → 活的那行的 DOM 節點（跨 render 保留）
  // 打字機：partial 約每秒一筆、每筆多 4 個字（實測），整段貼上會一坨一坨跳。
  // 新增的字在 TYPE_BUDGET_MS 內逐字揭開，剛好用掉下一筆到來前的空檔；
  // 內容改寫（縮回去、整句換，實測約 1/5）不打字，直接換並閃一下。
  var TYPE_BUDGET_MS = 700;
  var typers = {};     // speaker → {target, shown, timer}
  function stopTyper(st) { if (st && st.timer) { clearTimeout(st.timer); st.timer = null; } }
  function setLiveText(who, node, text) {
    var span = node.querySelector(".u-live");
    var st = typers[who] || (typers[who] = { target: "", shown: "", timer: null });
    if (!text) {                                  // 還沒有 partial：佔位，不打字
      stopTyper(st); st.target = st.shown = "正在說話…"; span.textContent = st.shown; return;
    }
    if (text === st.target) return;
    // 是不是接續：前一筆結尾的標點常被下一筆換掉（「過程，」→「過程沒有很漂亮。」），
    // 所以拿掉前一筆結尾標點再比前綴；已揭開的部分若含那個標點，先縮回去再往下打。
    var base = st.target.replace(/[。，、！？…：；]+$/, "");
    var extends_ = st.shown !== "正在說話…" && base.length > 0 && text.indexOf(base) === 0 && text.length > base.length;
    st.target = text;
    if (extends_ && st.shown.length > base.length) { st.shown = base; span.textContent = st.shown; }
    if (!extends_) {                              // 改寫：直接換
      stopTyper(st); st.shown = text; span.textContent = text;
      span.classList.remove("rewrite"); void span.offsetWidth; span.classList.add("rewrite");
      return;
    }
    if (!st.timer) tick();
    function tick() {
      st.timer = null;
      if (st.shown.length >= st.target.length) { st.shown = st.target; span.textContent = st.shown; return; }
      st.shown = st.target.slice(0, st.shown.length + 1);
      span.textContent = st.shown;
      var remaining = st.target.length - st.shown.length;
      st.timer = setTimeout(tick, Math.max(40, Math.min(160, TYPE_BUDGET_MS / (remaining + 1))));
    }
  }
  var LIVE_STALE_S = 6;  // 多久沒新的 partial 就淡出
  var LIVE_DROP_S = 10;  // 多久沒新的 partial 就移除
  function isLiveNode(el) { return !!(el && el.classList && el.classList.contains("now")); }

  function renderTranscript() {
    var box = el("transcript");
    var atBottom = isNearBottom(box);

    if (state.transcriptDirty) {
      box.innerHTML = "";
      renderedCount = 0;
      nodes = [];
      liveNodes = {};
      state.transcriptDirty = false;
    }

    for (; renderedCount < state.transcript.length; renderedCount++) {
      var item = state.transcript[renderedCount];
      var node = buildLine(item);
      var live = item.kind !== "chair" && item.kind !== "gloss" ? liveNodes[item.speaker] : null;
      if (live && live.parentNode === box) {
        // 定稿到了：在活的那行**原位**換成正式行，不是刪一行再加一行——位置不跳、
        // 文字從淡色過渡到正文色（.settle）。
        var ty = typers[item.speaker];
        var target = ty ? ty.target.replace(/[。，、！？…]+$/, "") : "";
        var isRewrite = !!target && target !== "正在說話" && String(item.text).indexOf(target) !== 0;
        node.classList.add(isRewrite ? "rewrite-settle" : "settle");
        box.replaceChild(node, live);
        delete liveNodes[item.speaker]; stopTyper(ty); delete typers[item.speaker];
      } else {
        box.appendChild(node);
      }
      nodes[renderedCount] = node;
    }

    // 活的那幾行：正在說話的每個人**一個固定節點**，partial 來了就地改字——不重建，
    // 游標動畫不重來、捲動不跳。不進 state.transcript。
    // 過期：短句被 STT 當雜音丟掉、或一直沒 commit 時，「定稿」與「speaking=false」都不會來，
    // 活的那行會一直掛著（實測：「哇！」掛了好一陣子）。實測 partial 間隔 p90 是 4.8s，
    // 所以 LIVE_STALE_S 之後視為沒在更新→淡出，LIVE_DROP_S 之後移除。
    var active = state.ended ? [] : Object.keys(state.speaking).filter(function (s) {
      if (!state.speaking[s]) return false;
      var age = state.liveAt[s] == null ? 0 : state.serverNow - state.liveAt[s];
      return age < LIVE_DROP_S;
    });
    Object.keys(liveNodes).forEach(function (who) {
      if (active.indexOf(who) < 0) { liveNodes[who].remove(); delete liveNodes[who]; stopTyper(typers[who]); delete typers[who]; }
    });
    active.forEach(function (who) {
      var live = state.partials[who];
      var node = liveNodes[who];
      if (!node) {
        node = nodeFromHtml(
          '<div class="u-line now" data-live-for="' + esc(who) + '">' +
          '<div class="u-time mono"></div>' +
          '<div class="u-text"><span class="u-speaker"></span>　<span class="u-live"></span><span class="u-cursor">▏</span></div></div>');
        liveNodes[who] = node;
      }
      node.querySelector(".u-time").textContent = fmtEventTime(state.serverNow);
      node.querySelector(".u-speaker").textContent = who;
      setLiveText(who, node, live);
      node.classList.toggle("placeholder", !live);
      var age = state.liveAt[who] == null ? 0 : state.serverNow - state.liveAt[who];
      node.classList.toggle("stale", age >= LIVE_STALE_S);
      if (node.parentNode !== box || node !== box.lastElementChild && !isLiveNode(box.lastElementChild)) box.appendChild(node);
    });

    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  // ── 右欄：四格數字 ──
  function renderStats() {
    // 「主席開口」拆成快路（規則）跟慢路（判斷）兩路來源，兩個數字互不重疊、
    // 加起來就是總數——不然「介入 11」跟「想過 34 次 · 開口 0」看起來會互相矛盾
    // （11 次全部來自快路規則，跟慢路的 34 次思考完全無關）。
    var kinds = Object.keys(state.spokenKinds).filter(function (k) { return k !== "問候"; });
    var ivTotal = kinds.reduce(function (n, k) { return n + state.spokenKinds[k]; }, 0);
    var ruleTotal = kinds
      .filter(function (k) { return FAST_KINDS.indexOf(k) !== -1; })
      .reduce(function (n, k) { return n + state.spokenKinds[k]; }, 0);
    var judgeTotal = ivTotal - ruleTotal;
    el("s-iv").textContent = String(ivTotal);
    el("s-iv-sub").textContent = "規則 " + ruleTotal + " · 判斷 " + judgeTotal;

    // 「實際發言」＝有人在講話的區間聯集，不是各人發言秒數加總（見 unionSeconds）。
    var talkSeconds = unionSeconds(state.segments);
    el("s-talk").innerHTML = (talkSeconds / 60).toFixed(1) + '<span class="stat-unit"> 分</span>';
    el("s-talk-sub").textContent = state.serverNow > 0
      ? "佔已進行 " + Math.min(100, Math.round(talkSeconds / state.serverNow * 100)) + "%"
      : "—";

    el("s-silence").textContent = fmtSpan(state.maxSilence);
    el("s-silence-sub").textContent = state.maxSilence >= SILENCE_LIMIT ? "曾觸發超時" : "未觸發超時";

    el("s-slow").innerHTML = state.slowTotal + '<span class="stat-unit"> 次</span>';
    // 三態：開口（真的講了）· 受阻（決定要講，卻連佇列都排不進去，或排進去後被
    // dropped／failed 擋下）· 忍住（自己判斷不需要開口）。還在 pending（結果沒到、
    // 通常是短暫過渡態）的不算進任何一格；一場正常播完的會議三格加總會等於
    // s-slow 的總次數，見 handleEvent 開頭關於 claimedSlowJudgment 的說明。
    el("s-slow-sub").textContent = state.slowTotal
      ? "開口 " + state.slowSpoke + " · 受阻 " + state.slowBlocked + " · 忍住 " + state.slowWithheld
      : "尚未評分";
  }

  // ── 右欄：時間軸 ──
  // 橫軸 0 → 已進行時間進位到整分（設計稿在 14:52 時右端標 15:00）。四層由下而上：
  // 底軌、發言段、忍住刻度與主席開口點（同一條 y=26~34 帶）、階段切換直線。
  function renderTimeline() {
    var W = 304;
    var axisEnd = Math.max(60, Math.ceil(Math.max(state.serverNow, 1) / 60) * 60);
    function x(t) { return Math.max(0, Math.min(W, t / axisEnd * W)); }

    var parts = ['<rect x="0" y="10" width="304" height="10" rx="2" fill="#EBE4D8"></rect>'];

    parts.push('<g fill="#B8AE9F">');
    state.segments.forEach(function (seg) {
      var x0 = x(seg.start), w = Math.max(2, x(seg.end) - x0);
      if (x0 + w > W) x0 = W - w;
      parts.push('<rect x="' + x0.toFixed(1) + '" y="10" width="' + w.toFixed(1) + '" height="10" rx="2"></rect>');
    });
    parts.push('</g>');

    parts.push('<g stroke="#C9C0B2" stroke-width="1.5">');
    state.withheldMarks.forEach(function (t) {
      var px = x(t).toFixed(1);
      parts.push('<line x1="' + px + '" y1="26" x2="' + px + '" y2="34"></line>');
    });
    parts.push('</g>');

    parts.push('<g fill="#A65D3F">');
    state.chairMarks.forEach(function (t) {
      parts.push('<circle cx="' + x(t).toFixed(1) + '" cy="30" r="3"></circle>');
    });
    parts.push('</g>');

    state.phaseMarks.forEach(function (mk) {
      var px = x(mk.t).toFixed(1);
      parts.push('<line x1="' + px + '" y1="4" x2="' + px + '" y2="38" stroke="#2B2622" stroke-width="1"></line>');
    });

    // 軸標。階段標籤只標最近一次切換，避免多次切換時文字疊在一起。
    parts.push('<g font-family="JetBrains Mono" font-size="10" fill="#A89F93">');
    parts.push('<text x="0" y="56">00:00</text>');
    parts.push('<text x="304" y="56" text-anchor="end">' + esc(fmtClock(axisEnd)) + '</text>');
    // 階段標籤靠近軸端（00:00／右端）時會疊到軸標，這種情況只留直線不標字。
    if (state.phaseMarks.length) {
      var last = state.phaseMarks[state.phaseMarks.length - 1];
      var lx = x(last.t);
      if (lx > 46 && lx < W - 46) {
        parts.push('<text x="' + lx.toFixed(1) + '" y="56" text-anchor="middle">' +
          esc(fmtClock(last.t) + " " + (PHASE_LABEL[last.phase] || last.phase)) + '</text>');
      }
    }
    parts.push('</g>');

    parts.push(
      '<g font-family="Noto Sans TC" font-size="10" fill="#857C72">' +
      '<rect x="0" y="72" width="10" height="6" rx="1" fill="#B8AE9F"></rect><text x="14" y="78">發言</text>' +
      '<circle cx="52" cy="75" r="3" fill="#A65D3F"></circle><text x="59" y="78">主席開口</text>' +
      '<line x1="112" y1="71" x2="112" y2="79" stroke="#C9C0B2" stroke-width="1.5"></line><text x="118" y="78">想過但忍住</text>' +
      '</g>');

    el("timeline").innerHTML = parts.join("");
  }

  // ── 右欄：會議節奏（Kaner 菱形，Track F）──
  // 菱形在任一 x 位置的上／下邊界是兩條直線內插（見工作單推導，x=246 代入算出
  // 31.2/64.8，跟提案圖第 157 行的寫死座標對得上，拿來當這兩個函式的驗算基準）。
  function kanerUpperY(x) {
    return x <= 160 ? 48 - 38 * (x - 6) / 154 : 10 + 38 * (x - 160) / 154;
  }
  function kanerLowerY(x) {
    return x <= 160 ? 48 + 38 * (x - 6) / 154 : 86 - 38 * (x - 160) / 154;
  }
  function renderKanerDiamond() {
    var svg = el("kaner-diamond");
    if (!svg) return;
    var m = state.meeting;
    // 沒有會議資料時分母用 1 只是避免除以 0，圖形仍會畫出來（marker 停在最左端），
    // 跟其他 KPI 格子在會議開始前顯示 0 是同一種「誠實佔位」邏輯。
    var total = (m && m.duration_min > 0) ? m.duration_min * 60 : 1;
    // 分界點預設均分三等份；一旦真的發生過對應的階段切換，改用第一次切過去的
    // 那筆真實時間（之後就不再是均分猜測）。
    var b1 = total / 3, b2 = total * 2 / 3, gotB1 = false, gotB2 = false;
    var trans = state.phaseTransitions;
    for (var i = 0; i < trans.length; i++) {
      if (!gotB1 && trans[i].to === "呻吟區") { b1 = trans[i].t; gotB1 = true; }
      if (!gotB2 && trans[i].to === "收斂期") { b2 = trans[i].t; gotB2 = true; }
    }
    if (b2 < b1) b2 = b1;   // 真實資料若跳過拉鋸直接切到收斂，仍保持左到右不倒退

    function px(t) { return 6 + Math.max(0, Math.min(1, t / total)) * 308; }
    var cx = px(state.serverNow), bx1 = px(b1), bx2 = px(b2);
    var uy = kanerUpperY(cx).toFixed(1), ly = kanerLowerY(cx).toFixed(1);

    var fillPath = cx <= 160
      ? "M 6 48 L " + cx.toFixed(1) + " " + uy + " L " + cx.toFixed(1) + " " + ly + " Z"
      : "M 6 48 L 160 10 L " + cx.toFixed(1) + " " + uy + " L " + cx.toFixed(1) + " " + ly + " L 160 86 Z";

    svg.innerHTML =
      '<path d="M 6 48 L 160 10 L 314 48 L 160 86 Z" fill="var(--card-bg)"></path>' +
      '<path d="' + fillPath + '" fill="var(--kaner-fill)"></path>' +
      '<line x1="' + bx1.toFixed(1) + '" y1="' + kanerUpperY(bx1).toFixed(1) + '" x2="' + bx1.toFixed(1) + '" y2="' + kanerLowerY(bx1).toFixed(1) + '" stroke="var(--kaner-track)" stroke-width="1" stroke-dasharray="3 4"></line>' +
      '<line x1="' + bx2.toFixed(1) + '" y1="' + kanerUpperY(bx2).toFixed(1) + '" x2="' + bx2.toFixed(1) + '" y2="' + kanerLowerY(bx2).toFixed(1) + '" stroke="var(--kaner-track)" stroke-width="1" stroke-dasharray="3 4"></line>' +
      '<path d="M 6 48 L 160 10 L 314 48 L 160 86 Z" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-linejoin="round"></path>' +
      '<line x1="' + cx.toFixed(1) + '" y1="24" x2="' + cx.toFixed(1) + '" y2="72" stroke="var(--text)" stroke-width="2"></line>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="48" r="3.5" fill="var(--text)"></circle>';

    // 三欄標籤寬度比例跟著上面算出的三個真實區段時長走（不是永遠 42/20/38）。
    var w1 = Math.max(1, b1), w2 = Math.max(1, b2 - b1), w3 = Math.max(1, total - b2);
    var sum = w1 + w2 + w3;
    var labelsEl = el("kaner-labels");
    labelsEl.style.gridTemplateColumns =
      (w1 / sum * 100).toFixed(2) + "fr " + (w2 / sum * 100).toFixed(2) + "fr " + (w3 / sum * 100).toFixed(2) + "fr";
    var activeIdx = m ? (m.phase === "發散期" ? 0 : m.phase === "呻吟區" ? 1 : m.phase === "收斂期" ? 2 : -1) : -1;
    labelsEl.innerHTML = ["發想", "拉鋸", "決定"].map(function (t, i) {
      return '<div class="kaner-label' + (i === activeIdx ? " active" : "") + '">' + t + '</div>';
    }).join("");

    el("kaner-now").textContent = m ? "目前：" + (PHASE_LABEL[m.phase] || m.phase) + "階段" : "—";

    // 有真的發生過轉換才引用那一筆；完全沒發生過就講真話，不照抄提案圖那句
    // 「主席取得評估授權後開始收斂」——那是示範用的假敘述，沒有對應的真實判斷邏輯。
    var last = trans.length ? trans[trans.length - 1] : null;
    var curLabel = m ? (PHASE_LABEL[m.phase] || m.phase) : null;
    el("kaner-caption").innerHTML = last
      ? '<span class="mono kaner-caption-time">' + esc(fmtClock(last.t)) + '</span> 由' +
        esc(PHASE_LABEL[last.from] || last.from) + '進入' + esc(PHASE_LABEL[last.to] || last.to)
      : (curLabel ? '尚未切換階段，目前處於「' + esc(curLabel) + '」' : '尚無會議資料');
  }

  // ── 右欄：主席的思考最近三次 ──
  // 三態措辭：忍住＝自己判斷不需要開口；開口＝決定要講而且真的講了；受阻＝決定要
  // 講、卻被 Chair 判 dropped／failed 擋下（沒講成）。pending＝結果還沒到，用
  // 「評估中」跟三個定案態區分，避免在結果未定時就先誤標成開口或受阻。
  function judgeBody(j) {
    if (j.status === "withheld") return '<b>忍住</b> · ' + esc(j.detail);
    if (j.status === "pending") return '<b>評估中</b> · ' + esc(j.type) + (j.detail ? ' — ' + esc(j.detail) : '');
    if (j.status === "blocked") {
      return '<b>受阻</b> · ' + esc(j.type) +
        (j.blockedReason ? '（' + esc(j.blockedReason) + '）' : '') +
        (j.detail ? ' — ' + esc(j.detail) : '');
    }
    return '<b>開口</b> · ' + esc(j.type) + (j.detail ? ' — ' + esc(j.detail) : '');
  }
  // pending 借用 blocked 的樣式（時間戳調暗）：兩者都是「還沒 / 沒能定案為開口」，
  // 用同一組既有 CSS 變數表達即可，不需要為 pending 另開一個 class。
  function judgeClass(j) {
    if (j.status === "withheld") return " withheld";
    if (j.status === "blocked" || j.status === "pending") return " blocked";
    return "";
  }
  function renderJudgments() {
    el("judge-list").innerHTML = state.judgments.slice(0, 3).map(function (j) {
      return '<div class="judge' + judgeClass(j) + '">' +
        '<div class="jt mono">' + esc(fmtEventTime(j.t)) + '</div>' +
        '<div class="jx">' + judgeBody(j) + '</div></div>';
    }).join("") || '<div class="judge withheld"><div class="jt mono">--:--</div><div class="jx">尚未評分</div></div>';
  }

  // ── 提示卡 ──
  // 卡片本體在左欄逐字稿流裡（見 buildLine 的 gloss 分支），右欄只留累積清單。
  // 每張卡的每一行都指得到出處——引言是逐字稿原話（時間戳＋原話），來源是真實網址。

  // 連結只顯示網域，標題放 title：右欄只有 380px，完整標題會把版面撐開。
  function hostOf(url) {
    var m = /^https?:\/\/([^/?#]+)/i.exec(String(url || ""));
    return m ? m[1].replace(/^www\./i, "") : String(url || "");
  }

  function quoteLine(label, m) {
    if (!m) return "";
    return '<div class="gc-quote"><span class="qt mono">' + esc(fmtEventTime(m.t)) + '</span> ' +
      esc(m.speaker) + " " + label + '：「' + esc(m.text) + '」</div>';
  }

  function glossCard(c, inline) {
    var parts = ['<div class="gc-head"><div class="gc-term">' + esc(c.term) + "</div>"];
    // 內嵌在逐字稿裡時要明講這不是主席開口，否則讀者會把它當成第三個發言者。
    if (inline) parts.push('<div class="gc-tag">術語補充</div>');
    // 只有提到一次就不標次數——「第 1 次提到」是廢話，佔掉右欄本來就很擠的一行。
    if (c.mentions > 1) parts.push('<div class="gc-count">提到 ' + esc(c.mentions) + " 次</div>");
    parts.push("</div>");
    // gloss 非 null 時 sources 必定非空（後端保證，見 glossary.build_card）；
    // 這裡仍然各自判斷，讀到舊的／手工造的 events.jsonl 也不會壞掉。
    if (c.gloss) parts.push('<div class="gc-gloss">' + esc(c.gloss) + "</div>");
    var sources = c.sources || [];
    if (sources.length) {
      parts.push('<div class="gc-src">' + sources.map(function (s) {
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" title="' +
          esc(s.title || s.url) + '">' + esc(hostOf(s.url)) + "</a>";
      }).join("") + "</div>");
    }
    parts.push(quoteLine("首次提到", c.first));
    // 解釋跟首次提到是同一則發言時不重印一次一模一樣的引言。
    if (c.explained && (!c.first || c.explained.t !== c.first.t)) {
      parts.push(quoteLine("說明過", c.explained));
    }
    return '<div class="gcard">' + parts.join("") + "</div>";
  }

  function lastMarkIs(phase) {
    var n = state.phaseMarks.length;
    return n > 0 && state.phaseMarks[n - 1].phase === phase;
  }

  // ── 右欄：發言分佈 ──
  function renderShare() {
    var names = Object.keys(state.share).filter(function (n) { return n !== "主席"; });
    names.sort(function (a, b) { return state.share[b] - state.share[a]; });
    if ("主席" in state.share) names.push("主席");  // 主席固定排最後

    el("share-list").innerHTML = names.map(function (name) {
      var pct = state.share[name] || 0;
      var isChair = name === "主席";
      return '<div class="share">' +
        '<div class="who" title="' + esc(name) + '">' + esc(name) + '</div>' +
        '<div class="track"><div class="fill' + (isChair ? " chair" : "") +
        '" style="width:' + Math.max(0, Math.min(100, pct * 100)).toFixed(1) + '%"></div></div>' +
        '<div class="pct mono">' + Math.round(pct * 100) + '%</div>' +
        '</div>';
    }).join("");
  }

  // ── 右欄：會議產出（預覽）── 設計稿之外新增的區塊（見 docs/design/README.md
  // 的偏離註記），只用既有色票／既有的 .section 版面語言，不發明新樣式。
  // 讀 state.minutesLive（只被 final=false 的預覽更新，final=true 到達時
  // 刻意不清空——見 state 宣告處與 handleEvent 的 "minutes" 分支）。
  // listStyle: "card"（決議/未解決，白卡片）｜"plain"（待辦，純文字列，提案圖本來就沒裝卡片）
  // 「剛更新」只標最後一筆——這幾組都是只增不減的預覽陣列，最後一筆＝最新一筆是查得到的事實，不是猜的。
  function renderMinutesGroup(title, items, renderItem, listStyle) {
    if (!items.length) return "";
    var cls = "ml-list " + (listStyle === "card" ? "ml-list--card" : "ml-list--plain") +
      (title === "未解決事項" ? " ml-list--unresolved" : "");
    var last = items.length - 1;
    return '<div class="ml-group"><div class="ml-group-head"><div class="ml-group-title">' + esc(title) +
      '</div><div class="ml-count">' + items.length + '</div></div>' +
      '<ul class="' + cls + '">' + items.map(function (it, i) {
        var badge = (listStyle === "card" && i === last && items.length > 1) ? '<div class="ml-badge-new">剛更新</div>' : "";
        return "<li>" + badge + renderItem(it) + "</li>";
      }).join("") + '</ul></div>';
  }

  function renderMinutesLive() {
    var data = state.minutesLive;
    var decisions = (data && data.decisions) || [];
    var todos = (data && data.todos) || [];
    var unresolved = (data && data.unresolved) || [];
    if (!decisions.length && !todos.length && !unresolved.length) {
      el("minutes-live").innerHTML = '<div class="ml-empty">尚無資料</div>';
      return;
    }
    el("minutes-live").innerHTML =
      renderMinutesGroup("決議事項", decisions, function (d) {
        return (d.who ? '<div class="ml-who">' + esc(d.who) + '</div>' : "") +
          '<div class="ml-what">' + esc(d.what || "") + (d.by ? '<span class="ml-muted">　' + esc(d.by) + ' 前</span>' : "") + '</div>';
      }, "card") +
      renderMinutesGroup("待辦事項", todos, function (t) {
        return (t.owner ? '<div class="ml-muted">' + esc(t.owner) + '</div>' : "<div></div>") +
          '<div>' + esc(t.task || "") + '</div>';
      }, "plain") +
      renderMinutesGroup("未解決事項", unresolved, function (u) {
        return '<div class="ml-what">' + esc(u.topic || "") + '</div>' +
          (u.chair_ruling ? '<div class="ml-muted">' + esc(u.chair_ruling) + '</div>' : "");
      }, "card");
  }

  // ── AI 即時觀察（Track D，D2）──────────────────────────────────────────
  // 以下三類（observe/judge/notice）全部是規則從既有已經算好的原子事實換算成
  // 一句話，不呼叫 LLM、不做語意理解（見檔案開頭工作單背景的說明）。每類各自
  // 跟「上一次推播的文字」比對，內容沒變就不重推，避免同一句話洗版。
  // 第四類「心聲」（T-G 新增；event kind 仍叫 critique，顯示文字是「心聲」）
  // 不在這裡——它真的呼叫 LLM，來源是後端 live.Session.watch_critique 送來的
  // "ai_critique" 事件，直接在 handleEvent() 的對應 case 裡 pushObservation，
  // 不經過這幾個 compute 函式。
  var SHARE_DOMINANCE_THRESHOLD = 0.65;  // 65%：夠高值得提醒，又不會在正常討論中亂觸發（可調）
  var DEADLOCK_COOLDOWN_S = 60;          // 僵局介入之後 60 秒沒有再介入，視為「已解除」（可調）
  var NOTICE_TIME_LEFT_RATIO = 0.3;      // 剩餘時間低於這個比例才提醒風險（可調）

  // 觀察類：發言分佈某人佔比過高。
  function computeObservation() {
    var names = Object.keys(state.share).filter(function (n) { return n !== "主席"; });
    if (!names.length) return null;
    var top = names[0];
    names.forEach(function (n) { if (state.share[n] > state.share[top]) top = n; });
    var pct = state.share[top] || 0;
    if (pct < SHARE_DOMINANCE_THRESHOLD) return null;
    var quiet = names.filter(function (n) { return n !== top && !(state.share[n] > 0); });
    var tail = quiet.length ? quiet.join("、") + "尚未表態" : "其他人參與偏少";
    return top + " 主導度偏高（" + Math.round(pct * 100) + "%），" + tail;
  }

  // 判斷類：階段轉換（拉鋸→決定）優先，其次是「僵局介入之後冷靜了一段時間」。
  function computeJudgment() {
    var trans = state.phaseTransitions;
    var last = trans.length ? trans[trans.length - 1] : null;
    if (last && last.from === "呻吟區" && last.to === "收斂期") {
      return "拉鋸結束，會議正式進入決定階段";
    }
    var lastDeadlock = null;
    for (var i = state.transcript.length - 1; i >= 0; i--) {
      var it = state.transcript[i];
      if (it.kind === "chair" && it.type === "僵局") { lastDeadlock = it.t; break; }
    }
    if (lastDeadlock != null && state.serverNow - lastDeadlock >= DEADLOCK_COOLDOWN_S) {
      return "僵局已解除，對話進入收斂節奏";
    }
    return null;
  }

  // 留意類：剩餘時間少、且即時決議預覽裡仍有沒收掉的未解決事項。
  // 合併 Track A 之後照原註記改讀真正的未解決清單（state.minutesLive.unresolved）。
  // 原本的代理值 state.spokenKinds["僵局"] 是「主席介入僵局的次數」，只增不減：
  // 僵局後來被談攏了它也不會回頭扣，所以會跟上面 computeJudgment() 的
  // 「僵局已解除」在同一塊面板裡同時出現、自相矛盾。minutesLive 是 LLM 每
  // MINUTES_PREVIEW_INTERVAL_S 重算一次的當下快照，收掉的項目會真的消失。
  // 它在 --no-llm 模式與開場前幾次預覽之前是 null，這時候不提醒——沒有資料就
  // 不講話，比拿一個語意不同的數字硬湊一句誠實（Track A 的面板同樣顯示尚無資料）。
  function computeNotice() {
    if (!state.meeting) return null;
    var total = state.meeting.duration_min * 60;
    if (!total) return null;
    var remaining = total - state.serverNow;
    if (remaining / total >= NOTICE_TIME_LEFT_RATIO) return null;
    var unresolved = ((state.minutesLive && state.minutesLive.unresolved) || []).length;
    if (!unresolved) return null;
    var mins = Math.max(0, Math.round(remaining / 60));
    return "仍有 " + unresolved + " 項未解決事項，剩餘 " + mins + " 分鐘";
  }

  function pushObservation(kind, text) {
    if (!text || state.obsLastText[kind] === text) return;
    state.obsLastText[kind] = text;
    state.observations.unshift({ t: state.serverNow, kind: kind, text: text });
    state.observations = state.observations.slice(0, 20);
  }

  var OBS_LABEL = { observe: "觀察", judge: "判斷", notice: "留意" };

  // 心聲類（內部 kind 前綴仍叫 "critique"，顯示文字是「心聲」——2026-09-05
  // 中途拍板：這類判斷不一定是負評，「批判」預設負面，「心聲」更準）的 kind
  // 是動態的（"critique_meeting"／"critique_person:<name>"），塞不進上面那個
  // 固定物件——OBS_LABEL 三類維持原樣不動，這裡加一層查表。
  function obsLabelFor(kind) {
    if (OBS_LABEL[kind]) return OBS_LABEL[kind];
    if (kind === "critique_meeting") return "心聲";
    if (kind.indexOf("critique_person:") === 0) return "心聲 · " + kind.slice(16);
    return kind;
  }

  function renderObservations() {
    var box = el("obs-list");
    if (!box) return;
    pushObservation("observe", computeObservation());
    pushObservation("judge", computeJudgment());
    pushObservation("notice", computeNotice());
    if (!state.observations.length) {
      box.innerHTML = '<div class="obs-empty">尚無觀察</div>';
      return;
    }
    // state.observations 是新→舊；畫面照設計稿由舊到新往下排，最新一則帶打字游標。
    var rows = state.observations.slice(0, 8).slice().reverse();
    box.innerHTML = rows.map(function (o, i) {
      // 「心聲」是真的呼叫 LLM 判斷出來的，跟其餘三類規則算出來的不一樣——
      // 標籤顏色改用 --accent（主席唯一的強調色）誠實區分，不新增裸 hex。
      var isCritique = o.kind === "critique_meeting" || o.kind.indexOf("critique_person:") === 0;
      return '<div class="obs-row"><span class="ot mono">' + esc(fmtEventTime(o.t)) + '</span>' +
        '&nbsp; <span class="ok' + (isCritique ? ' ok-critique' : '') + '">' + esc(obsLabelFor(o.kind)) + '：</span>' +
        '<span class="ox">' + esc(o.text) + '</span>' +
        (i === rows.length - 1 ? '<span class="obs-cursor mono">▍</span>' : '') +
        '</div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  // ── 兩顆按鈕 ──
  // 匯出＝下載 minutes 事件帶回來的 LLM 會議記錄（決議／待辦／未解決／每人立場）。
  // minutes 只在會議收尾時產生，還沒有的時候按下去用按鈕自己的文字提示，不改版面。
  var exportBtn = el("btn-export");
  var exportBusy = false;

  function flashButton(btn, text, ms) {
    if (exportBusy) return;
    exportBusy = true;
    var original = btn.textContent;
    btn.textContent = text;
    setTimeout(function () { btn.textContent = original; exportBusy = false; }, ms || 2000);
  }

  exportBtn.addEventListener("click", function () {
    var md = state.minutes && state.minutes.minutes_md;
    if (!md) { flashButton(exportBtn, "會議結束後才有紀錄", 2000); return; }
    var path = state.minutes.minutes_path || "minutes.md";
    var name = path.split("/").pop() || "minutes.md";
    var url = URL.createObjectURL(new Blob([md], { type: "text/markdown;charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // 結束會議走 POST /end（＝與 kill -TERM 同一個開關）。現場 demo 誤觸的代價是
  // 整場會議收掉，所以要按兩次：第一次把按鈕文字換成確認提示，5 秒內沒有第二次
  // 就自己還原。設計稿沒有確認彈窗，這裡不新增元素，只改按鈕自己的文字。
  var endBtn = el("btn-end");
  var endArmed = false;
  var endTimer = null;

  endBtn.addEventListener("click", function () {
    if (state.ended) return;
    if (!endArmed) {
      endArmed = true;
      endBtn.textContent = "再按一次結束";
      endTimer = setTimeout(function () {
        endArmed = false;
        endBtn.textContent = "結束會議";
      }, 5000);
      return;
    }
    clearTimeout(endTimer);
    endArmed = false;
    endBtn.textContent = "結束中…";
    fetch("/end", { method: "POST", headers: authHeaders() }).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || "結束失敗"); });
    }).catch(function (err) {
      console.error("結束會議失敗", err);
      endBtn.textContent = "結束失敗";
      setTimeout(function () { endBtn.textContent = "結束會議"; }, 3000);
    });
  });

  // ── 事件處理 ──
  function pushTranscript(item) {
    state.transcript.push(item);
    state.transcript.sort(function (a, b) { return a.t - b.t; });
    // 逐字稿依 start 排序，但事件到達順序可能因語音重疊而與 start 順序不同。
    // 排序後新項沒落在尾端＝被插到中間，render 端無法只 append，需整段重建一次。
    if (state.transcript[state.transcript.length - 1] !== item) state.transcriptDirty = true;
  }

  // 回傳被清掉的那筆 pendingQueued 項目（找不到就回傳 null）——呼叫端要用它身上
  // 可能掛著的 _judgment（見 handleEvent 的 "queued" 分支）把慢路判斷跟結果對回去。
  function resolveQueued(data) {
    var idx = state.pendingQueued.findIndex(function (q) {
      return q.kind === data.kind && q.target === data.target && q.text === data.text;
    });
    if (idx === -1) idx = state.pendingQueued.length ? 0 : -1;
    if (idx === -1) return null;
    return state.pendingQueued.splice(idx, 1)[0];
  }

  function handleEvent(ev) {
    state.serverNow = ev.t;
    renderKanerDiamond();   // 唯一時鐘來源就是這裡；不另開 setInterval，見工作單背景說明
    var data = ev.data;
    // 見 state.awaitingQueuedJudgment 的說明：每次呼叫都先取出、清空，只有這次
    // 事件剛好是 "queued" 才會用到（掛回 data._judgment），其餘事件類型讓它作廢。
    var claimedSlowJudgment = state.awaitingQueuedJudgment;
    state.awaitingQueuedJudgment = null;
    // 上一筆是 admissible 的慢路判斷，這一筆卻不是它的 queued——代表 Chair.request()
    // 當下回了 False，根本沒有排進佇列（見 speaker.py Chair.request 的忙碌／退避／
    // 已有 pending 三個 False 分支；live.py `_run_slow_score` 的 TOCTOU 註解也寫明：
    // should_score 的 busy 只擋「評分前」忙，擋不到「評分中」快路搶先出聲的情況）。
    // 決定要講、卻連佇列都排不進去，一樣是「受阻」，不能讓它卡在 pending／「評估中」
    // 一路等到會議結束——正常結束一定有 minutes 事件收尾，這條規則同樣適用，所以
    // 完整播完的一場會議，開口+受阻+忍住 的加總必定等於總評分次數。
    // 唯一例外：連線在這筆判斷之後、下一筆事件送達之前就整個斷了（不是正常的
    // minutes 收尾，是串流真的中斷）——那種情況下沒有任何後續事件可以判斷
    // Chair.request() 到底成不成功，畫面停在「評估中」是誠實的「不知道」，不是
    // bug，也不該在斷線當下瞎猜成受阻；此時加總會小於總次數，這是資訊不足，
    // 不是配對邏輯錯誤。
    if (claimedSlowJudgment && ev.kind !== "queued") {
      claimedSlowJudgment.status = "blocked";
      claimedSlowJudgment.blockedReason = "主席忙碌中";
      state.slowBlocked += 1;
      renderStats();
      renderJudgments();
    }
    switch (ev.kind) {
      case "meeting":
        // 階段真的變了才記一筆時間軸標記；第一筆 meeting 是初始階段，不算切換。
        // `phase` 事件（人或偵測器切換）也會推標記；meeting 重送時若最後一筆已是同階段就不重畫。
        if (state.meeting && state.meeting.phase !== data.phase && !lastMarkIs(data.phase)) {
          // AI 即時觀察的「判斷類」規則要看轉換方向（例如拉鋸→決定），phaseMarks
          // 只記切到哪一階段、不記從哪來，所以另開一份帶 from/to 的紀錄。
          state.phaseTransitions.push({ t: ev.t, from: state.meeting.phase, to: data.phase });
          state.phaseMarks.push({ t: ev.t, phase: data.phase });
          renderTimeline();
        }
        state.meeting = data;
        renderTop();
        renderKanerDiamond();   // 剛推進 phaseTransitions／換了 duration_min，重畫一次撿最新值
        break;
      case "utterance":
        delete state.partials[data.speaker];   // 定稿到了，活的那行由正式逐字稿取代
        pushTranscript({ kind: "utterance", t: data.start, speaker: data.speaker, text: data.text });
        state.segments.push({ start: data.start, end: data.end });
        renderTranscript();
        renderStats();
        renderTimeline();
        break;
      case "speaking":
        state.speaking[data.speaker] = !!data.active;
        if (data.active) state.liveAt[data.speaker] = ev.t;
        if (!data.active) { delete state.partials[data.speaker]; delete state.liveAt[data.speaker]; }
        renderTranscript();
        break;
      case "fast_timer":
        if (Object.keys(liveNodes).length) renderTranscript();   // 讓活的那行的過期規則每秒有機會生效
        // 全場沉默＝所有人「距離上次發言」的最小值；取歷史最大就是最長沉默。
        var silent = data.silent || {};
        var names = Object.keys(silent);
        if (names.length) {
          var global = Math.min.apply(null, names.map(function (n) { return silent[n]; }));
          if (global > state.maxSilence) state.maxSilence = global;
        }
        renderStats();
        renderTop();
        break;
      case "slow_score":
        state.slowTotal += 1;
        var detail;
        if (data.admissible) {
          // 還不知道結果——admissible 只代表「這次評分通過閘門、排進佇列」，不代表
          // 真的講出來了：接下來可能被 Chair 判 dropped（例如 revision 過期作廢）
          // 或 failed（合成/播放失敗），也可能真的 spoken。三者之一到達前先標成
          // pending；status 之後由 "spoken"／"dropped"／"failed" 分支原地改寫
          // 這個物件（同一個參照，不是新建一筆），所以就算此刻被 slice(0,3) 擠出
          // 畫面外，之後改寫仍然有效，只是不一定還顯示得到。
          var judgment = {
            t: ev.t, status: "pending", type: data.type,
            // 設計稿的理由是一句短話；pros 常有兩三條，全串起來一定被截斷，取第一條。
            detail: (data.pros || [])[0] || data.utterance || "",
          };
          state.judgments.unshift(judgment);
          state.awaitingQueuedJudgment = judgment;
        } else if (BLOCKED_AFTER_DECISION_REASON[data.reason]) {
          // 已經決定要開口、話術那一步才失手——定案就是「受阻」，不用等後續事件
          // （這筆判斷根本沒送進 Chair，不會有 queued／spoken／dropped 跟著來）。
          state.slowBlocked += 1;
          state.judgments.unshift({
            t: ev.t, status: "blocked", type: data.type,
            blockedReason: BLOCKED_AFTER_DECISION_REASON[data.reason],
            detail: (data.pros || [])[0] || "",
          });
        } else {
          state.slowWithheld += 1;
          state.withheldMarks.push(ev.t);
          detail = WITHHELD_REASON[data.reason || ""];
          if (detail == null) detail = data.reason;
          state.judgments.unshift({ t: ev.t, status: "withheld", type: data.type, detail: detail });
        }
        state.judgments = state.judgments.slice(0, 3);
        renderStats();
        renderJudgments();
        renderTimeline();
        break;
      case "queued":
        // 只有真的緊接在 admissible 慢路後面的那一筆 queued 才會拿到 claimedSlowJudgment
        // （快路的 queued 前一筆事件是 fast_timer，不是 slow_score，claimedSlowJudgment
        // 一定是 null）；掛在 data 上帶著走，等 spoken／dropped／failed 來時再取出來用。
        if (claimedSlowJudgment) data._judgment = claimedSlowJudgment;
        state.pendingQueued.push(data);
        renderTop();
        break;
      case "spoken": {
        var resolvedSpoken = resolveQueued(data);
        state.lastSpokenAt = data.at != null ? data.at : ev.t;
        pushTranscript({ kind: "chair", t: state.lastSpokenAt, speaker: "主席", text: data.text, type: data.kind });
        state.spokenKinds[data.kind] = (state.spokenKinds[data.kind] || 0) + 1;
        state.chairMarks.push(state.lastSpokenAt);
        if (resolvedSpoken && resolvedSpoken._judgment) {
          // 這筆 spoken 是某個慢路 pending 判斷的結果——定案為「開口」。
          resolvedSpoken._judgment.status = "spoken";
          state.slowSpoke += 1;
        }
        // 真的出聲了＝發聲路徑是通的，連續失敗歸零（見 TTS_FAIL_ALERT）
        state.ttsFailStreak = 0;
        renderAlerts();
        renderTranscript();
        renderStats();
        renderJudgments();
        renderTimeline();
        renderTop();
        break;
      }
      case "failed":
      case "dropped": {
        // 沒真的出聲的候選不計入「主席介入」，也不上時間軸；只是把 pending 清掉，
        // 讓頂列狀態從「等停頓」回到「聆聽中」。
        // `failed` 才是「想開口卻發不出聲」（TTS／播放失敗，見 speaker.py 的
        // on_failed 呼叫點）；`dropped` 是介入被作廢（revision 過期、被取代、
        // shutdown），跟發聲能力無關，所以只有 failed 累加連續失敗計數。
        if (ev.kind === "failed") {
          state.ttsFailStreak += 1;
          state.lastTtsFail = { t: ev.t, reason: data.reason, kind: data.kind };
          renderAlerts();
        }
        var resolvedVoid = resolveQueued(data);
        if (resolvedVoid && resolvedVoid._judgment) {
          // 這筆 dropped／failed 是某個慢路 pending 判斷的結果——它決定要講，
          // 但沒講成，定案為第三態「受阻」，不能算「開口」。
          resolvedVoid._judgment.status = "blocked";
          resolvedVoid._judgment.blockedReason = data.reason;
          state.slowBlocked += 1;
          renderStats();
          renderJudgments();
        }
        renderTop();
        break;
      }
      case "hearing":
        // 主席聽不聽得見。**邊緣事件**：只在狀態改變時送（見 events.py 的 kind
        // 說明），所以直接覆蓋當前狀態即可，不必比對時間。
        // 刻意只碰告示列：它跟 glossary 一樣不代表主席的介入行為——不經過 Chair、
        // 不佔冷卻期、不發 TTS，所以任何一格「主席」的數字都不該因為它而動。
        state.hearing = data;
        renderAlerts();
        break;
      case "partial":
        // 這段目前的全文（累積），覆蓋上一筆；只影響活的那一行
        state.partials[data.speaker] = data.text;
        state.liveAt[data.speaker] = ev.t;
        renderTranscript();
        break;
      case "phase":
        // 階段真的改了（人或偵測器）：更新現況、時間軸標記、清掉建議提示
        if (state.meeting) {
          if (state.meeting.phase !== data.phase) {
            state.phaseTransitions.push({ t: ev.t, from: state.meeting.phase, to: data.phase });
          }
          state.meeting.phase = data.phase;
        }
        if (!lastMarkIs(data.phase)) state.phaseMarks.push({ t: ev.t, phase: data.phase });
        state.phaseHint = null;
        renderTop(); renderTimeline(); renderKanerDiamond();   // 剛推進 phaseTransitions，重畫一次撿最新分界點
        break;
      case "phase_suggestion":
        // 偵測器的一次讀數。不代表主席行為，只在狀態列加一個括號提示。
        state.phaseHint = data.applied ? null : data;
        renderTop();
        break;
      case "glossary":
        // 靜默事件：只進逐字稿流。刻意不碰 renderStats／renderTimeline／
        // renderTop——提示卡不是主席開口，不該讓任何一格「主席」的數字動。
        // ev.t 是卡片產生的時刻，不是術語出現的時刻，所以它會落在逐字稿尾端
        // （append，不觸發 transcriptDirty 重建）。
        pushTranscript({ kind: "gloss", t: ev.t, card: data });
        renderTranscript();
        break;
      case "share":
        state.share = data;
        renderShare();
        break;
      case "minutes":
        // final=true：T3a 在收尾時發的最後一筆事件，帶兩份 md 全文與四個路徑，
        // 鎖畫面、鎖匯出按鈕。final=false：會議進行中的預覽，只更新內容，不鎖定
        // ——兩者共用同一個 event kind，靠 final 分辨（見 live._emit_minutes／
        // Session.watch_minutes）。
        if (data.final) {
          state.minutes = data;
          setEnded();
          renderTranscript();
        } else {
          state.minutesLive = data;
          renderMinutesLive();
        }
        break;
      case "ai_critique":
        // T-G：AI 主席的「心聲」——真的呼叫 LLM 產生的判斷，跟其餘三類（觀察/
        // 判斷/留意）是規則算出來的不同（見 live.Session.watch_critique）。
        // event kind／data 欄位名稱維持 "critique" 命名不改，只有面板顯示文字
        // 是「心聲」（2026-09-05 中途拍板：這類判斷不一定是負評，「批判」預設
        // 負面，「心聲」更準）。data 形狀是 {meeting: str, participants: {名字:
        // 評語}}——participants 是物件不是陣列，省略某人＝不評論他，不會給 null。
        // 進同一個 state.observations 陣列、同一個 renderObservations()，靠
        // kind 前綴 "critique_meeting"／"critique_person:<name>" 讓 obsLabelFor()
        // 認出來，視覺上用 --accent 標示區分（見 renderObservations() 與
        // .ok-critique）。不在這裡呼叫 renderObservations()——switch 結束後
        // 已經統一呼叫一次（見下方註解），跟其他 case 的既有慣例一致。
        if (data.meeting) pushObservation("critique_meeting", data.meeting);
        Object.keys(data.participants || {}).forEach(function (name) {
          var note = data.participants[name];
          if (note) pushObservation("critique_person:" + name, name + "——" + note);
        });
        break;
    }
    // AI 即時觀察：全部規則都是從上面已經更新完的 state 算出來的原子事實，
    // 所以放在 switch 之後統一算一次，不用每個 case 各自呼叫一遍。
    renderObservations();
  }

  // snapshot 是伺服器端「權威全量」——每次新連線／重連都重送一次從頭到現在的
  // 全部事件。重播前先把所有「跟著事件累積」的 state／DOM／游標清空，讓 snapshot
  // 重播出全新的一份，不做「比 t 大才收」的增量策略（事件到達順序本來就可能跟
  // t 不一致，增量比對無法正確判斷是否已收過）。
  // state.ended／state.connectionLost 是連線狀態本身、不是事件累積出來的資料，
  // 不在清空範圍——但 state.minutes 是，因為它會隨 snapshot 一起重播回來。
  function resetForSnapshot() {
    state.transcript = [];
    state.transcriptDirty = false;
    state.speaking = {};
    state.partials = {};
    state.liveAt = {};
    state.pendingQueued = [];
    state.lastSpokenAt = null;
    state.share = {};
    state.minutes = null;
    state.minutesLive = null;
    state.spokenKinds = {};
    state.segments = [];
    state.chairMarks = [];
    state.withheldMarks = [];
    state.phaseMarks = [];
    state.maxSilence = 0;
    state.slowTotal = 0;
    state.slowSpoke = 0;
    state.slowBlocked = 0;
    state.slowWithheld = 0;
    state.judgments = [];
    state.awaitingQueuedJudgment = null;
    // 這三個一樣是「跟著事件累積」出來的（hearing／failed／spoken），snapshot 會
    // 重播回來，不清的話重連之後連續失敗次數會被重複累加成兩倍
    state.hearing = null;
    state.ttsFailStreak = 0;
    state.lastTtsFail = null;
    // AI 即時觀察也是「跟著事件累積」出來的，同一批理由：不清空重連會讓去重
    // 比對讀到上一輪連線留下的舊文字，或讓 observations 陣列無限疊上去。
    state.obsLastText = { observe: null, judge: null, notice: null };
    state.observations = [];
    state.phaseTransitions = [];
    renderedCount = 0;
    nodes = [];
    el("transcript").innerHTML = "";
  }

  // ── SSE ──
  var KINDS = ["meeting", "utterance", "speaking", "fast_timer", "slow_score",
    "queued", "spoken", "failed", "dropped", "share", "minutes", "glossary", "hearing",
    "phase", "phase_suggestion", "partial", "ai_critique"];

  // SSE 不能設自訂 header，權杖只能放在 query string（見 spectator.py TOKEN_QUERY）。
  // 沒有權杖時先問 /health（公開）：伺服器若不是 --public-read，直接顯示「需要權杖」，
  // 不要盲連再顯示「連線中斷」——那兩件事的處置完全不同。
  var source = null;
  function connect() {
    source = new EventSource("/events" + (authToken ? "?k=" + encodeURIComponent(authToken) : ""));
    wireSource();
  }
  if (authToken) {
    connect();
  } else {
    fetch("/health").then(function (r) { return r.json(); }).then(function (d) {
      if (d.public_read) { connect(); return; }
      state.needToken = true;
      renderTop();
    }).catch(function () { connect(); });
  }
  function wireSource() {
    source.addEventListener("snapshot", function (e) {
      var events = JSON.parse(e.data);
      resetForSnapshot();
      events.forEach(handleEvent);
      renderStats();
      renderJudgments();
      renderShare();
      renderTimeline();
      renderKanerDiamond();
      renderTop();
      renderAlerts();
      renderMinutesLive();
      renderObservations();
    });
    KINDS.forEach(function (kind) {
      source.addEventListener(kind, function (e) { handleEvent(JSON.parse(e.data)); });
    });
    source.onerror = function () { setConnectionLost(true); };
    source.onopen = function () { setConnectionLost(false); };
  }

  renderTop();
  renderStats();
  renderJudgments();
  renderShare();
  renderTimeline();
  renderKanerDiamond();
  renderAlerts();
  renderMinutesLive();
  renderObservations();

  // ── 群體動力：把手 + 抽屜開合（Track D，D3）──────────────────────────
  // 用真正的 <button>，Tab 能定位、Enter／Space 天生會觸發 click，不必自己
  // 寫 keydown 判斷（見 docs/DEFERRED_DEFECTS.md 第 1 項那次的教訓）。
  (function () {
    var handle = el("dyn-handle");
    var drawer = el("dyn-drawer");
    var closeBtn = el("dyn-close");
    function setOpen(open) {
      drawer.classList.toggle("open", open);
      drawer.setAttribute("aria-hidden", open ? "false" : "true");
      handle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    handle.addEventListener("click", function () {
      setOpen(!drawer.classList.contains("open"));
    });
    closeBtn.addEventListener("click", function () { setOpen(false); });
  })();
})();
</script>
</body>
</html>
